[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pilotkit"
version = "0.1.0"
description = "Taking a permission-aware AI assistant from discovery to measurable value: connectors, red team, evals and pilot readout."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
pilotkit = "pilotkit.cli:main"

[tool.setuptools]
packages = ["pilotkit", "pilotkit.connectors"]
